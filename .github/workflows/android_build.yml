name: Android MobileVM CI/CD Build Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test MobileVM Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew || true

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileVM-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build Release AAB (Android App Bundle)
        run: ./gradlew bundleRelease --stacktrace --no-daemon
        continue-on-error: true

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileVM-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
        continue-on-error: true
