name: MobileVM Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build MobileVM APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          else
            echo "ERROR: Android SDK was not found."
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null | head -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      - name: Install Android build components
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "app/build.gradle.kts"
            "gradle/libs.versions.toml"
            "gradle/wrapper/gradle-wrapper.properties"
            "app/src/main/cpp/CMakeLists.txt"
            "gradlew"
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || {
              echo "ERROR: Missing required file: $file"
              exit 1
            }
          done

          echo "Project structure verified."

      - name: Make Gradle Wrapper executable
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euo pipefail

          java -version
          ./gradlew --version

      - name: Verify Gradle plugin resolution
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            help

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Run Unit Tests
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            testDebugUnitTest

      - name: Verify Debug APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileVM-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attest Debug APK
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: app/build/outputs/apk/debug/app-debug.apk
