name: MobileVM Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  JAVA_VERSION: "21"
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK_VERSION: "26.1.10909125"
  CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: Build MobileVM APK
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-provider: basic

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK was not found."
            exit 1
          fi

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null | head -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "gradle/libs.versions.toml"
            "gradlew"
            "gradle/wrapper/gradle-wrapper.jar"
            "gradle/wrapper/gradle-wrapper.properties"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/cpp/CMakeLists.txt"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required file: $file"
              exit 1
            fi
          done

          echo "All required MobileVM project files are present."

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euo pipefail

          java -version
          ./gradlew --version

      - name: Verify Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            help

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean

      - name: Compile Kotlin and KSP
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:compileDebugKotlin \
            :app:kspDebugKotlin

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobilevm-test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: warn

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease

      - name: Verify APK files
        shell: bash
        run: |
          set -euo pipefail

          DEBUG_APK="$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1 || true)"

          RELEASE_APK="$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1 || true)"

          if [ -z "$DEBUG_APK" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "Debug APK: $DEBUG_APK"
          echo "Release APK: $RELEASE_APK"

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release-artifacts
          mkdir -p release-artifacts

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -exec cp {} release-artifacts/ \;

          cd release-artifacts

          sha256sum *.apk > SHA256SUMS.txt

          echo "Generated checksums:"
          cat SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobilevm-apks
          path: release-artifacts/*.apk
          if-no-files-found: error

      - name: Upload SHA256 checksums
        uses: actions/upload-artifact@v4
        with:
          name: mobilevm-sha256
          path: release-artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attest Debug APK
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: app/build/outputs/apk/debug/*.apk

      - name: Attest Release APK
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: app/build/outputs/apk/release/*.apk
