name: MobileVM Android Build

on:
push:
branches:
- main
- master
pull_request:
branches:
- main
- master
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build MobileVM APK
runs-on: ubuntu-24.04

steps:
  - name: Checkout project
    uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'
      cache: gradle

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK, NDK and CMake
    run: |
      sdkmanager --install \
        "platform-tools" \
        "platforms;android-36" \
        "build-tools;36.0.0" \
        "cmake;3.22.1" \
        "ndk;27.2.12479018"

  - name: Set Android SDK environment
    run: |
      echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
      echo "ANDROID_NDK_VERSION=27.2.12479018" >> "$GITHUB_ENV"

  - name: Make Gradle executable
    run: chmod +x ./gradlew

  - name: Check Gradle
    run: ./gradlew --version

  - name: Clean project
    run: ./gradlew --no-daemon clean

  - name: Run unit tests
    run: ./gradlew --no-daemon testDebugUnitTest

  - name: Build Debug APK
    run: ./gradlew --no-daemon assembleDebug

  - name: Check generated APK
    run: |
      echo "Searching for APK..."
      find app/build/outputs/apk -type f -name "*.apk" -print
      test -f app/build/outputs/apk/debug/app-debug.apk

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: MobileVM-debug-apk
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14
