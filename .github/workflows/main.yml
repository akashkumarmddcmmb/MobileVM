name: MobileVM Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  JAVA_VERSION: "17"
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK_VERSION: "26.1.10909125"
  CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: Build MobileVM APK
    runs-on: ubuntu-24.04

    steps:

      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. Java 17
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ---------------------------------------------------------
      # 3. Android SDK
      # ---------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ""


      # ---------------------------------------------------------
      # 4. Install exact Android components required by project
      # ---------------------------------------------------------
      - name: Install Android build components
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "JAVA_HOME=${JAVA_HOME}"

          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"


      # ---------------------------------------------------------
      # 5. Verify Android SDK
      # ---------------------------------------------------------
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Installed Android packages:"

          sdkmanager --list_installed | grep -E \
            "platform-tools|platforms;android-36|build-tools;36.0.0|ndk;26.1.10909125|cmake;3.22.1" \
            || true


      # ---------------------------------------------------------
      # 6. Verify Gradle wrapper
      # ---------------------------------------------------------
      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          echo "Gradle wrapper verified."


      # ---------------------------------------------------------
      # 7. Verify required project files
      # ---------------------------------------------------------
      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "gradle/libs.versions.toml"
            "gradlew"
            "gradle/wrapper/gradle-wrapper.jar"
            "gradle/wrapper/gradle-wrapper.properties"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/cpp/CMakeLists.txt"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Required file missing: $file"
              exit 1
            fi
          done

          echo "Project structure verified."


      # ---------------------------------------------------------
      # 8. Verify Java + Gradle
      # ---------------------------------------------------------
      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euo pipefail

          java -version

          ./gradlew --version


      # ---------------------------------------------------------
      # 9. Verify Gradle configuration
      # ---------------------------------------------------------
      - name: Verify Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            help


      # ---------------------------------------------------------
      # 10. Clean
      # ---------------------------------------------------------
      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean


      # ---------------------------------------------------------
      # 11. Compile Kotlin + KSP
      # ---------------------------------------------------------
      - name: Compile Kotlin and KSP
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:compileDebugKotlin \
            :app:kspDebugKotlin


      # ---------------------------------------------------------
      # 12. Fix Robolectric test SDK automatically for CI
      #
      # NewFeaturesValidationTest was trying to use the newer
      # default Android SDK. The project test suite already uses
      # Robolectric SDK 34 for these tests.
      #
      # This creates a CI-only Robolectric configuration so the
      # source test file does not have to be manually replaced.
      # ---------------------------------------------------------
      - name: Configure Robolectric test SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/test/resources

          cat > app/src/test/resources/robolectric.properties <<'EOF'
          sdk=34
          EOF

          echo "Robolectric SDK configured for CI:"
          cat app/src/test/resources/robolectric.properties


      # ---------------------------------------------------------
      # 13. Run unit tests
      # ---------------------------------------------------------
      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:testDebugUnitTest


      # ---------------------------------------------------------
      # 14. Upload test reports even if tests fail
      # ---------------------------------------------------------
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobilevm-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore


      # ---------------------------------------------------------
      # 15. Build Debug APK
      # ---------------------------------------------------------
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug


      # ---------------------------------------------------------
      # 16. Build Release APK
      # ---------------------------------------------------------
      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease


      # ---------------------------------------------------------
      # 17. Verify APK output
      # ---------------------------------------------------------
      - name: Verify APK files
        shell: bash
        run: |
          set -euo pipefail

          DEBUG_APK="$(
            find app/build/outputs/apk/debug \
              -type f \
              -name "*.apk" \
              | head -n 1 || true
          )"

          RELEASE_APK="$(
            find app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              | head -n 1 || true
          )"

          if [ -z "$DEBUG_APK" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "Debug APK:"
          echo "$DEBUG_APK"

          echo "Release APK:"
          echo "$RELEASE_APK"


      # ---------------------------------------------------------
      # 18. Prepare release artifacts + SHA256
      # ---------------------------------------------------------
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release-artifacts
          mkdir -p release-artifacts

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -exec cp {} release-artifacts/ \;

          cd release-artifacts

          sha256sum *.apk > SHA256SUMS.txt

          echo "SHA-256 checksums:"
          cat SHA256SUMS.txt


      # ---------------------------------------------------------
      # 19. Upload APK artifacts
      # ---------------------------------------------------------
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobilevm-apks
          path: release-artifacts/*.apk
          if-no-files-found: error


      # ---------------------------------------------------------
      # 20. Upload SHA256
      # ---------------------------------------------------------
      - name: Upload SHA-256 checksums
        uses: actions/upload-artifact@v4
        with:
          name: mobilevm-sha256
          path: release-artifacts/SHA256SUMS.txt
          if-no-files-found: error


      # ---------------------------------------------------------
      # 21. Build provenance - Debug APK
      # ---------------------------------------------------------
      - name: Attest Debug APK
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: app/build/outputs/apk/debug/*.apk


      # ---------------------------------------------------------
      # 22. Build provenance - Release APK
      # ---------------------------------------------------------
      - name: Attest Release APK
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: app/build/outputs/apk/release/*.apk
