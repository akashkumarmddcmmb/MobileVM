name: MobileVM Build and Security

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

env:
  JAVA_VERSION: "17"
  ANDROID_PLATFORM: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK: "26.1.10909125"
  CMAKE_VERSION: "3.22.1"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

jobs:

  # ==========================================================
  # CODEQL SECURITY ANALYSIS
  # ==========================================================
  codeql:
    name: CodeQL Security - ${{ matrix.language }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
          - language: c-cpp

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v6


      # ------------------------------------------------------
      # Java
      # ------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ------------------------------------------------------
      # Android SDK
      # ------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ------------------------------------------------------
      # Android build components
      # ------------------------------------------------------
      - name: Install Android components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;${CMAKE_VERSION}"


      # ------------------------------------------------------
      # Gradle wrapper
      # ------------------------------------------------------
      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          ./gradlew --version


      # ------------------------------------------------------
      # CodeQL initialization
      #
      # IMPORTANT:
      # Manual build is intentional.
      # No CodeQL autobuild is used.
      # ------------------------------------------------------
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
          dependency-caching: true


      # ------------------------------------------------------
      # CodeQL manual Android build
      #
      # KSP is NOT called separately.
      # Gradle invokes KSP through the normal build graph.
      # ------------------------------------------------------
      - name: CodeQL manual build
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            :app:assembleDebug


      # ------------------------------------------------------
      # CodeQL analysis
      # ------------------------------------------------------
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"


  # ==========================================================
  # NORMAL BUILD + TEST
  # ==========================================================
  build:
    name: Build and Test MobileVM
    runs-on: ubuntu-24.04

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v6


      # ------------------------------------------------------
      # Java 17
      # ------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ------------------------------------------------------
      # Gradle cache
      # ------------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5


      # ------------------------------------------------------
      # Android SDK
      # ------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ------------------------------------------------------
      # Android SDK / NDK / CMake
      # ------------------------------------------------------
      - name: Install Android components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;${CMAKE_VERSION}"


      # ------------------------------------------------------
      # Verify project
      # ------------------------------------------------------
      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          chmod +x gradlew

          echo "Project structure OK."


      # ------------------------------------------------------
      # Gradle configuration
      # ------------------------------------------------------
      - name: Validate Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            help


      # ------------------------------------------------------
      # Clean
      # ------------------------------------------------------
      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            clean


      # ------------------------------------------------------
      # Unit tests
      # ------------------------------------------------------
      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            :app:testDebugUnitTest


      # ------------------------------------------------------
      # Debug APK
      # ------------------------------------------------------
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            :app:assembleDebug


      # ------------------------------------------------------
      # Verify Debug APK
      # ------------------------------------------------------
      - name: Verify Debug APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1 || true)"

          if [ -z "$APK" ]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          echo "Debug APK:"
          echo "$APK"

          ls -lh "$APK"


      # ------------------------------------------------------
      # Release APK
      # ------------------------------------------------------
      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            :app:assembleRelease


      # ------------------------------------------------------
      # Verify Release APK
      # ------------------------------------------------------
      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1 || true)"

          if [ -z "$APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          echo "Release APK:"
          echo "$APK"

          ls -lh "$APK"


      # ------------------------------------------------------
      # Prepare artifacts
      # ------------------------------------------------------
      - name: Prepare APK artifacts
        shell: bash
        run: |
          set -euo pipefail

          rm -rf artifacts
          mkdir -p artifacts

          DEBUG_APK="$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          RELEASE_APK="$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          cp "$DEBUG_APK" artifacts/MobileVM-debug.apk
          cp "$RELEASE_APK" artifacts/MobileVM-release.apk

          cd artifacts

          sha256sum \
            MobileVM-debug.apk \
            MobileVM-release.apk \
            > SHA256SUMS.txt

          echo "Artifacts:"
          ls -lh

          echo
          echo "SHA256:"
          cat SHA256SUMS.txt


      # ------------------------------------------------------
      # Upload APK artifacts
      # ------------------------------------------------------
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MobileVM-APKs
          path: |
            artifacts/MobileVM-debug.apk
            artifacts/MobileVM-release.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: error


      # ------------------------------------------------------
      # Upload reports
      # ------------------------------------------------------
      - name: Upload build and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MobileVM-Build-Reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore


  # ==========================================================
  # DEPENDENCY SECURITY
  # ==========================================================
  dependency-review:
    name: Dependency Security Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:

      - name: Checkout source
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high


  # ==========================================================
  # SECRET / SECURITY CONFIGURATION CHECK
  # ==========================================================
  security-config:
    name: Security Configuration Check
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout source
        uses: actions/checkout@v6


      # ------------------------------------------------------
      # Check for accidentally committed local secrets
      # ------------------------------------------------------
      - name: Check repository for obvious secret files
        shell: bash
        run: |
          set -euo pipefail

          forbidden_files=(
            ".env"
            "local.properties"
            "keystore.properties"
          )

          found=0

          for file in "${forbidden_files[@]}"; do
            if [ -f "$file" ]; then
              echo "::error::Sensitive local file found in repository: $file"
              found=1
            fi
          done

          if [ "$found" -ne 0 ]; then
            exit 1
          fi

          echo "No forbidden local secret files found."


      # ------------------------------------------------------
      # Check for private signing keys
      # ------------------------------------------------------
      - name: Check for private key files
        shell: bash
        run: |
          set -euo pipefail

          if find . \
            -type f \
            \( \
              -name "*.jks" \
              -o -name "*.keystore" \
              -o -name "*.p12" \
              -o -name "*.pfx" \
            \) \
            -not -path "./.git/*" \
            | grep -q .; then

            echo "::error::A signing/private key file was found in the repository."
            exit 1
          fi

          echo "No signing key files found."


      # ------------------------------------------------------
      # Check .gitignore
      # ------------------------------------------------------
      - name: Verify sensitive files are ignored
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f .gitignore ]; then
            echo "::warning::.gitignore is missing."
            exit 0
          fi

          echo ".gitignore found."

          grep -q "local.properties" .gitignore \
            || echo "::warning::local.properties is not explicitly listed in .gitignore."

          grep -q "\.jks" .gitignore \
            || echo "::warning::JKS files are not explicitly listed in .gitignore."

          grep -q "\.keystore" .gitignore \
            || echo "::warning::Keystore files are not explicitly listed in .gitignore."
