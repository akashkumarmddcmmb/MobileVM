name: MobileVM Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MobileVM APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          if [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          else
            echo "Android SDK was not found."
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found."
            echo "Available Android SDK directories:"
            find "$SDK" -maxdepth 3 -type d | sort | head -100
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "SDKMANAGER found at:"
          echo "$SDKMANAGER"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android build components
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo "SDK Manager:"
          "$SDKMANAGER" --version

          echo "Installed packages:"
          "$SDKMANAGER" --list_installed | grep -E \
            "platform-tools|platforms;android-36|build-tools;36.0.0|cmake;3.22.1" || true

      - name: Check project structure
        shell: bash
        run: |
          set -e

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/libs.versions.toml
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f app/src/main/cpp/CMakeLists.txt

          echo "Required project files found."

      - name: Download Gradle 9.3.1
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="9.3.1"
          GRADLE_DIR="$RUNNER_TEMP/gradle-$GRADLE_VERSION"

          curl -fL \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o "$RUNNER_TEMP/gradle.zip"

          mkdir -p "$RUNNER_TEMP/gradle"

          unzip -q \
            "$RUNNER_TEMP/gradle.zip" \
            -d "$RUNNER_TEMP/gradle"

          echo "$RUNNER_TEMP/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

          echo "Gradle installed:"
          "$RUNNER_TEMP/gradle/gradle-${GRADLE_VERSION}/bin/gradle" --version

      - name: Verify Gradle configuration
        shell: bash
        run: |
          set -e
          gradle --version

      - name: Clean build
        shell: bash
        run: |
          set -e
          gradle --no-daemon clean

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Run Unit Tests
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            testDebugUnitTest

      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: app-debug.apk was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileVM-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
