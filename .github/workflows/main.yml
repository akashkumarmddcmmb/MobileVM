name: MobileVM Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  JAVA_VERSION: "17"
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK_VERSION: "26.1.10909125"
  CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: Build MobileVM APK
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "gradlew"
            "gradle/wrapper/gradle-wrapper.properties"
            "gradle/wrapper/gradle-wrapper.jar"
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle/libs.versions.toml"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/cpp/CMakeLists.txt"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required file: $file"
              exit 1
            fi
          done

          chmod +x ./gradlew

          echo "Project structure verified."

      - name: Verify Java Gradle Android environment
        shell: bash
        run: |
          set -euo pipefail

          echo "===== JAVA ====="
          java -version

          echo ""
          echo "===== GRADLE ====="
          ./gradlew --version

          echo ""
          echo "===== ANDROID SDK ====="
          echo "${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          echo ""
          echo "===== CMAKE ====="
          cmake --version

          echo ""
          echo "===== NDK ====="
          test -d "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          echo "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean

      - name: Compile and run unit tests
        id: unit_tests
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:compileDebugKotlin \
            :app:kspDebugKotlin \
            :app:testDebugUnitTest

      - name: Diagnose failed unit tests
        if: failure() && steps.unit_tests.outcome == 'failure'
        shell: bash
        run: |
          set -u

          echo "=============================================="
          echo "MobileVM UNIT TEST FAILURE DIAGNOSTICS"
          echo "=============================================="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --info \
            --rerun-tasks \
            :app:testDebugUnitTest \
            2>&1 | tee unit-test-diagnostics.log

          TEST_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "Diagnostic test exit code: ${TEST_EXIT}"

          exit "${TEST_EXIT}"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MobileVM-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            unit-test-diagnostics.log
          if-no-files-found: warn
          retention-days: 14

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease

      - name: Verify APKs and generate SHA-256
        shell: bash
        run: |
          set -euo pipefail

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$DEBUG_APK"
          test -f "$RELEASE_APK"

          echo "===== DEBUG APK ====="
          ls -lh "$DEBUG_APK"

          echo ""
          echo "===== RELEASE APK ====="
          ls -lh "$RELEASE_APK"

          echo ""
          echo "===== DEBUG SHA-256 ====="
          sha256sum "$DEBUG_APK"

          echo ""
          echo "===== RELEASE SHA-256 ====="
          sha256sum "$RELEASE_APK"

          sha256sum "$DEBUG_APK" > "${DEBUG_APK}.sha256"
          sha256sum "$RELEASE_APK" > "${RELEASE_APK}.sha256"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MobileVM-APKs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK checksums
        uses: actions/upload-artifact@v4
        with:
          name: MobileVM-APK-SHA256
          path: |
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Attest Debug APK
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: app/build/outputs/apk/debug/app-debug.apk

      - name: Attest Release APK
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: app/build/outputs/apk/release/app-release.apk
